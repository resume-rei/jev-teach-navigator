name: Native and mock contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Mock API and storage contracts
        run: npm test
      - name: JavaScript and UI source checks
        run: npm run check
      - name: Build native application and run synthetic self-tests
        shell: powershell
        run: .\windows\build.ps1 -SelfTest
